<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CadX - Interactive Blueprint & Drawing Zoom Inspector</title>
  <script>
    (function() {
      var isBenign = function(msg, lineno, colno) {
        if (lineno === 0 || colno === 0) return true;
        if (!msg) return false;
        var str = String(msg).toLowerCase();
        return (
          str.indexOf('script error') !== -1 ||
          str.indexOf('resizeobserver') !== -1 ||
          str.indexOf('networkerror') !== -1 ||
          str.indexOf('failed to fetch') !== -1
        );
      };
      window.addEventListener('error', function(e) {
        var msg = (e && (e.message || (e.error && e.error.message))) || '';
        if (isBenign(msg, e ? e.lineno : 0, e ? e.colno : 0)) {
          if (e) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
          return false;
        }
      }, true);
    })();
  </script>
  <!-- Tailwind CSS CDN (v3/v4 compatible build for simple standalone setups) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts: Space Grotesk (Tech Heading) and Inter (Sans UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-tech {
      font-family: 'Space Grotesk', sans-serif;
    }
    .font-mono-cad {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Hide scrollbars for aesthetic precision */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #020617;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ef4444;
    }
    /* Blueprint micro grid background pattern */
    .blueprint-grid {
      background-size: 20px 20px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
  </style>
</head>
<body class="h-full flex flex-col overflow-hidden blueprint-grid text-slate-100 select-none antialiased">

  <!-- TOP HEADER HUB -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur-md px-4 py-2.5 flex items-center justify-between gap-4 z-20 shrink-0">
    <div class="flex items-center gap-3">
      <div class="h-8 w-8 rounded bg-red-600 flex items-center justify-center shadow-md text-white font-tech font-bold text-base select-none">
        CX
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-sm font-extrabold tracking-tight font-tech uppercase text-slate-100">CADX ZOOM INSPECTOR</h1>
          <span class="bg-red-500/10 text-red-500 font-mono-cad text-[9px] font-bold px-1.5 py-0.5 rounded border border-red-500/20 tracking-widest">
            STABLE
          </span>
        </div>
      </div>
    </div>

    <!-- System telemetry -->
    <div class="flex items-center gap-3 text-[11px] font-mono-cad font-medium text-slate-400">
      <div class="bg-slate-950 p-1 px-2.5 border border-slate-800 rounded flex items-center gap-2">
        <i data-lucide="compass" class="w-3.5 h-3.5 text-red-500"></i>
        <span>COORDS: <span id="current-coords" class="text-white font-bold">X: 0.00%, Y: 0.00%</span></span>
      </div>
      <div id="lock-state-badge" class="bg-slate-950 p-1 px-2.5 border border-slate-800 rounded flex items-center gap-2 text-slate-400 transition-colors">
        <i data-lucide="unlock" id="lock-state-icon" class="w-3.5 h-3.5 text-slate-400"></i>
        <span id="lock-state-text">UNLOCKED</span>
      </div>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <main class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">

    <!-- LEFT BAR: EXPLORATION CONTROLS AND DOCUMENT SELECTOR -->
    <section class="w-full lg:w-72 border-r border-slate-800 bg-slate-900/50 backdrop-blur-md p-3.5 flex flex-col gap-4 z-10 overflow-y-auto shrink-0 select-none">
      
      <!-- Interactive Presets Selector -->
      <div class="space-y-2">
        <h2 class="text-[11px] font-black uppercase text-slate-400 tracking-wider font-tech flex items-center gap-1.5">
          <i data-lucide="folder-open" class="w-3.5 h-3.5 text-red-500"></i>
          SCHEMATIC PRESETS
        </h2>
        
        <div class="grid grid-cols-1 gap-1.5">
          <!-- Preset 1: Anchor Bolt -->
          <button 
            type="button"
            onclick="loadPreset('bolt-blueprint')" 
            id="preset-btn-bolt-blueprint"
            class="group w-full p-2 bg-slate-950 hover:bg-slate-900 border border-slate-800 hover:border-red-500 rounded text-left transition-all cursor-pointer flex items-center gap-2.5 active-preset"
          >
            <div class="w-10 h-10 bg-slate-900 rounded border border-slate-800 overflow-hidden flex-shrink-0 relative">
              <img src="https://images.unsplash.com/photo-1540959733332-eab4deceeaf7?auto=format&fit=crop&w=150&q=80" class="w-full h-full object-cover group-hover:scale-105 transition-transform" />
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="text-[11px] font-bold text-slate-200 truncate group-hover:text-red-400 transition-colors uppercase">Structural Bolt CAD</h3>
              <p class="text-[9px] text-slate-400 font-mono-cad truncate">ASTM A325 Spec</p>
            </div>
          </button>

          <!-- Preset 2: Cable Tray System -->
          <button 
            type="button"
            onclick="loadPreset('tray-schematic')" 
            id="preset-btn-tray-schematic"
            class="group w-full p-2 bg-slate-950 hover:bg-slate-900 border border-slate-800 hover:border-red-500 rounded text-left transition-all cursor-pointer flex items-center gap-2.5"
          >
            <div class="w-10 h-10 bg-slate-900 rounded border border-slate-800 overflow-hidden flex-shrink-0 relative">
              <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=150&q=80" class="w-full h-full object-cover group-hover:scale-105 transition-transform" />
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="text-[11px] font-bold text-slate-200 truncate group-hover:text-red-400 transition-colors uppercase">Cable Tray Pattern</h3>
              <p class="text-[9px] text-slate-400 font-mono-cad truncate">Ventilated Grid</p>
            </div>
          </button>

          <!-- Preset 3: Mechanical Hub -->
          <button 
            type="button"
            onclick="loadPreset('machinery-spec')" 
            id="preset-btn-machinery-spec"
            class="group w-full p-2 bg-slate-950 hover:bg-slate-900 border border-slate-800 hover:border-red-500 rounded text-left transition-all cursor-pointer flex items-center gap-2.5"
          >
            <div class="w-10 h-10 bg-slate-900 rounded border border-slate-800 overflow-hidden flex-shrink-0 relative">
              <img src="https://images.unsplash.com/photo-1504917595217-d4dc5ebe6122?auto=format&fit=crop&w=150&q=80" class="w-full h-full object-cover group-hover:scale-105 transition-transform" />
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="text-[11px] font-bold text-slate-200 truncate group-hover:text-red-400 transition-colors uppercase">Engine Cross-Section</h3>
              <p class="text-[9px] text-slate-400 font-mono-cad truncate">Torque Anchors</p>
            </div>
          </button>
        </div>
      </div>

      <!-- Drag and Drop Custom Drawing Upload -->
      <div class="space-y-2">
        <h2 class="text-[11px] font-black uppercase text-slate-400 tracking-wider font-tech flex items-center gap-1.5">
          <i data-lucide="upload" class="w-3.5 h-3.5 text-red-500"></i>
          LOCAL FILE UPLOAD
        </h2>

        <div 
          id="dropzone"
          onpointerdown="event.stopPropagation()"
          class="border border-dashed border-slate-800 hover:border-red-500 bg-slate-950 flex flex-col items-center justify-center p-3 text-center transition-all cursor-pointer rounded select-none relative group"
        >
          <input 
            type="file" 
            id="file-element" 
            accept="image/*" 
            class="absolute inset-0 opacity-0 cursor-pointer" 
            onchange="handleFileSelect(event)" 
          />
          <span class="block text-[11px] font-bold text-slate-300">Choose / Drop Drawing</span>
        </div>
      </div>

      <!-- Interactive Adjustments Panel -->
      <div class="space-y-3 border-t border-slate-800 pt-3 mt-auto">
        <!-- Magnification Scale Factor -->
        <div class="space-y-1.5">
          <div class="flex justify-between text-[11px] font-mono-cad text-slate-400 font-bold">
            <span>ZOOM SCALE</span>
            <span id="scale-indicator" class="text-red-400 font-bold">3.0x</span>
          </div>
          <input 
            type="range" 
            id="zoom-scale-range" 
            min="1.5" 
            max="6" 
            step="0.1" 
            value="3.0"
            oninput="updateZoomScale(this.value)"
            class="w-full h-1 bg-slate-950 border border-slate-800 rounded-lg appearance-none cursor-pointer accent-red-500 focus:outline-none"
          />
        </div>
      </div>
    </section>

    <!-- RIGHT PANEL: STABLE FULL-FIT INTERACTIVE VIEWPORT STAGE (NO UNWANTED GAPS) -->
    <section class="flex-1 bg-slate-950 p-2 flex flex-col items-center justify-center relative overflow-hidden select-none">
      
      <!-- IMAGE INTERACTIVE STAGE WRAPPER - STABLE FULL VIEWPORT FIT -->
      <div 
        id="image-stage-container"
        class="relative w-full h-full border border-slate-800 hover:border-slate-700 bg-slate-900 rounded overflow-hidden select-none cursor-crosshair shadow-2xl z-10 flex items-center justify-center"
      >
        <!-- The Interactive Magnified Image -->
        <img 
          id="zoom-image"
          src="https://images.unsplash.com/photo-1540959733332-eab4deceeaf7?auto=format&fit=crop&w=1200&q=80" 
          alt="Technical Drawing Blueprint" 
          class="w-full h-full object-contain pointer-events-none transform origin-center select-none"
          referrerpolicy="no-referrer"
        />

        <!-- FLOATING OVERLAY COORDINATE MATRIX (Always Visible, Updates Live) -->
        <div class="absolute top-3 left-3 bg-slate-950/90 backdrop-blur-md px-2.5 py-1 border border-slate-800 rounded flex items-center gap-2 text-[10px] font-mono-cad select-none pointer-events-none">
          <span class="w-1.5 h-1.5 bg-red-500 rounded-full"></span>
          <span id="overlay-zoom-power" class="font-bold text-white uppercase">3.0X</span>
          <span class="text-slate-700">|</span>
          <span id="overlay-lock-indicator" class="text-slate-400 uppercase">TRACE LIVE</span>
        </div>

        <!-- DYNAMIC FLOATING ACTION OVERLAY CONTROLS (Only visible when zoom locked) -->
        <div 
          id="locked-action-overlay"
          class="absolute inset-3 pointer-events-none flex flex-col justify-between items-end z-20 opacity-0 transition-opacity duration-200"
        >
          <!-- Dynamic Locked Coordinate Marker HUD -->
          <div class="bg-red-950/90 backdrop-blur-sm p-2.5 border border-red-500/40 rounded text-left select-none max-w-xs self-start pointer-events-auto shadow-xl" id="coordinate-detail-hud">
            <div class="flex items-center gap-1.5">
              <i data-lucide="crosshair" class="w-3.5 h-3.5 text-red-500"></i>
              <span class="text-[10px] font-black tracking-wider text-white uppercase font-tech">COORDINATE LOCKED</span>
            </div>
            <div class="flex items-center gap-3 mt-1 font-mono-cad text-[10px]">
              <div>
                <span class="text-slate-400 text-[8px] uppercase">POS X:</span>
                <span id="locked-grid-x" class="text-white font-bold font-mono ml-1">0.0%</span>
              </div>
              <div>
                <span class="text-slate-400 text-[8px] uppercase">POS Y:</span>
                <span id="locked-grid-y" class="text-white font-bold font-mono ml-1">0.0%</span>
              </div>
            </div>
          </div>

          <!-- The Floating Overlay Controls Container -->
          <div class="flex items-center gap-2 pointer-events-auto select-none bg-slate-950/95 backdrop-blur-md p-2 border border-red-500/40 rounded shadow-2xl" id="actions-panel">
            
            <!-- Download focus snippet button -->
            <button 
              type="button"
              onclick="triggerImageDownload(event)"
              class="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white font-tech font-bold uppercase text-[10px] tracking-wider transition-all flex items-center gap-1.5 rounded cursor-pointer select-none"
              title="Save focused drawing snapshot snippet"
            >
              <i data-lucide="download" class="w-3.5 h-3.5 text-white"></i>
              <span>Download View</span>
            </button>

            <!-- Close/Unlock Viewport button -->
            <button 
              type="button"
              onclick="unlockMagnifier(event)"
              class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-700 font-tech font-bold uppercase text-[10px] tracking-wider transition-all flex items-center gap-1 rounded cursor-pointer select-none"
              title="Unlock snapshot screen view"
            >
              <span class="text-red-500 font-sans">✕</span>
              <span>Close View</span>
            </button>
          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- Interactive status notice alert toaster -->
  <div 
    id="toast-notification"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 border border-slate-700 p-3 px-5 text-xs text-white uppercase tracking-wider font-mono-cad font-bold z-50 select-none transition-all duration-300 opacity-0 pointer-events-none transform translate-y-2 rounded shadow-2xl"
  >
    Blueprint analyzer state changed!
  </div>

  <script>
    // System Local Registry States
    const state = {
      isLocked: false,
      zoomScale: 3.0,
      currentOriginX: '50%',
      currentOriginY: '50%',
      lockedOriginX: '50%',
      lockedOriginY: '50%',
      currentImageName: 'ASTM A325 Structural Bolt Blueprint'
    };

    // Images presets catalog maps
    const PRESETS = {
      'bolt-blueprint': {
        name: 'ASTM A325 Structural Bolt Blueprint',
        url: 'https://images.unsplash.com/photo-1540959733332-eab4deceeaf7?auto=format&fit=crop&w=1200&q=80',
        meta: 'Target Fastener: M12 x 85 Hex Anchor bolt',
        calibration: 'Metric scale 10:1'
      },
      'tray-schematic': {
        name: 'Heavy Tray Assembly Pattern Drawing',
        url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80',
        meta: 'Target Fastener: Heavy cable return tray hanger grid',
        calibration: 'Metric scale M10 anchor arrays'
      },
      'machinery-spec': {
        name: 'Engine Block Cross-Section Blueprint',
        url: 'https://images.unsplash.com/photo-1504917595217-d4dc5ebe6122?auto=format&fit=crop&w=1200&q=80',
        meta: 'Target Fastener: Heavy casting torque anchors M24 spec',
        calibration: 'Metric scale 5:1 engine cylinder clearance'
      }
    };

    // Elements
    const elements = {
      stage: document.getElementById('image-stage-container'),
      image: document.getElementById('zoom-image'),
      scaleIndicator: document.getElementById('scale-indicator'),
      scaleInput: document.getElementById('zoom-scale-range'),
      currentCoords: document.getElementById('current-coords'),
      lockStateBadge: document.getElementById('lock-state-badge'),
      lockStateIcon: document.getElementById('lock-state-icon'),
      lockStateText: document.getElementById('lock-state-text'),
      overlayZoomPower: document.getElementById('overlay-zoom-power'),
      overlayLockIndicator: document.getElementById('overlay-lock-indicator'),
      lockedActionOverlay: document.getElementById('locked-action-overlay'),
      lockedGridX: document.getElementById('locked-grid-x'),
      lockedGridY: document.getElementById('locked-grid-y'),
      toast: document.getElementById('toast-notification'),
      coordinateDetailHud: document.getElementById('coordinate-detail-hud'),
      actionsPanel: document.getElementById('actions-panel'),
      fileElement: document.getElementById('file-element'),
      dropzone: document.getElementById('dropzone')
    };

    // Initialize Lucide Icons on document ready
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      attachInteractiveListeners();
    });

    // Main interaction handler logic
    function attachInteractiveListeners() {
      const stage = elements.stage;

      // Mousemove trace listener
      stage.addEventListener('mousemove', (e) => {
        if (state.isLocked) return;

        const rect = stage.getBoundingClientRect();
        // Calculate absolute percentage coordinate pointers of mouse over stage
        const xPercent = ((e.clientX - rect.left) / rect.width) * 100;
        const yPercent = ((e.clientY - rect.top) / rect.height) * 100;

        // Keep values bounded beautifully
        const boundedX = Math.max(0, Math.min(100, xPercent));
        const boundedY = Math.max(0, Math.min(100, yPercent));

        state.currentOriginX = `${boundedX}%`;
        state.currentOriginY = `${boundedY}%`;

        // Draw live magnification preview tracing coordinates
        applyZoomTransform(state.zoomScale, state.currentOriginX, state.currentOriginY);

        // Update telemetry data displays
        elements.currentCoords.innerText = `X: ${boundedX.toFixed(2)}%, Y: ${boundedY.toFixed(2)}%`;
      });

      // Mouseleave reset zoom back smoothly
      stage.addEventListener('mouseleave', () => {
        if (state.isLocked) return;

        // Reset image back to neutral scaling
        elements.image.style.transformOrigin = 'center center';
        elements.image.style.transform = 'scale(1)';
        elements.image.style.transition = 'transform 0.4s ease-out, transform-origin 0.4s ease-out';
        
        // Reset telemetry Display
        elements.currentCoords.innerText = `X: 0.00%, Y: 0.00%`;
      });

      // Mouseenter triggers clean transition removal so follow response is instant
      stage.addEventListener('mouseenter', () => {
        if (state.isLocked) return;
        elements.image.style.transition = 'none';
      });

      // Click event creates state LOCK coordinates freeze
      stage.addEventListener('click', (e) => {
        if (state.isLocked) return; // Ignore click events if locked state already on

        state.isLocked = true;
        // Freeze zoom positions based on the current origin tracking
        state.lockedOriginX = state.currentOriginX;
        state.lockedOriginY = state.currentOriginY;

        applyZoomTransform(state.zoomScale, state.lockedOriginX, state.lockedOriginY);

        // Calculate and fix locked coordinates
        const rect = stage.getBoundingClientRect();
        const finalX = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
        const finalY = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));

        // Update UI displays
        elements.lockedGridX.innerText = `${finalX.toFixed(1)}%`;
        elements.lockedGridY.innerText = `${finalY.toFixed(1)}%`;

        elements.lockStateBadge.className = "bg-red-500/10 text-red-500 p-1 px-3 border border-red-500/30 rounded flex items-center gap-2";
        elements.lockStateIcon.setAttribute('data-lucide', 'lock');
        elements.lockStateIcon.style.color = '#ef4444';
        elements.lockStateText.innerText = `COORDS LOCKED`;
        elements.overlayLockIndicator.innerText = `LOCK ENGAGED`;
        elements.overlayLockIndicator.className = "font-black text-red-400 uppercase tracking-widest animate-pulse";

        // Bring overlay controls gracefully in
        elements.lockedActionOverlay.className = "absolute inset-4 pointer-events-none flex flex-col justify-between items-end z-20 opacity-100 transition-opacity duration-300";
        elements.coordinateDetailHud.className = "bg-red-950/95 backdrop-blur-md p-4 border-2 border-red-500/40 rounded-lg text-left select-none max-w-xs self-start pointer-events-auto transform translate-y-0 transition-transform duration-300 shadow-2xl";
        elements.actionsPanel.className = "flex items-center gap-3 pointer-events-auto select-none bg-slate-950/95 backdrop-blur-md p-3.5 border-2 border-red-500/40 rounded-xl shadow-2xl scale-100 transition-all duration-300";

        // Recreate icons dynamically
        lucide.createIcons();

        triggerToast(`COORDINATE LOCKED @ ${finalX.toFixed(1)}% , ${finalY.toFixed(1)}%`);
      });
    }

    // Apply scaling and origins calculations to drawing element
    function applyZoomTransform(scale, originX, originY) {
      elements.image.style.transformOrigin = `${originX} ${originY}`;
      elements.image.style.transform = `scale(${scale})`;
    }

    // Handles unlocking from locked screenshot mode
    function unlockMagnifier(e) {
      if (e) {
        e.stopPropagation(); // Stop clicking Close button from re-triggering lock
      }

      state.isLocked = false;
      elements.image.style.transition = 'transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform-origin 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
      elements.image.style.transformOrigin = 'center center';
      elements.image.style.transform = 'scale(1)';

      // Restore unlocked UI display parameters
      elements.lockStateBadge.className = "bg-slate-950 p-1 px-3 border border-slate-800 rounded flex items-center gap-2 text-slate-400";
      elements.lockStateIcon.setAttribute('data-lucide', 'unlock');
      elements.lockStateIcon.style.color = '#94a3b8';
      elements.lockStateText.innerText = "VIEWPORT UNLOCKED";
      elements.overlayLockIndicator.innerText = "TRACE LIVE";
      elements.overlayLockIndicator.className = "text-slate-400 uppercase";

      // Animate overlay buttons out cleanly
      elements.lockedActionOverlay.className = "absolute inset-4 pointer-events-none flex flex-col justify-between items-end z-20 opacity-0 transition-opacity duration-350";
      elements.coordinateDetailHud.className = "bg-red-950/95 backdrop-blur-md p-4 border-2 border-red-500/40 rounded-lg text-left select-none max-w-xs self-start pointer-events-auto transform translate-y-[-10px] transition-transform duration-300 shadow-2xl";
      elements.actionsPanel.className = "flex items-center gap-3 pointer-events-auto select-none bg-slate-950/95 backdrop-blur-md p-3.5 border-2 border-red-500/40 rounded-xl shadow-2xl scale-95 transition-all duration-300";

      // Recreate icons dynamically
      lucide.createIcons();

      triggerToast("MAGNIFIER UNLOCKED - TRACKING MOUSE HOVER");
    }

    // Live slider scale factor controller
    function updateZoomScale(val) {
      state.zoomScale = parseFloat(val);
      elements.scaleIndicator.innerText = `${state.zoomScale.toFixed(1)}x`;
      elements.overlayZoomPower.innerText = `${state.zoomScale.toFixed(1)}X`;

      // Draw immediately on active display
      if (state.isLocked) {
        applyZoomTransform(state.zoomScale, state.lockedOriginX, state.lockedOriginY);
      } else {
        applyZoomTransform(state.zoomScale, state.currentOriginX, state.currentOriginY);
      }
    }

    // Triggers custom physical file download as clean PNG file
    function triggerImageDownload(e) {
      if (e) e.stopPropagation();

      // Trigger standard local storage or mock simulation download easily
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = elements.image.src;

      triggerToast("Synthesizing CAD high-resolution snapshot area...");

      img.onload = function() {
        canvas.width = img.naturalWidth || 1920;
        canvas.height = img.naturalHeight || 1080;
        
        ctx.fillStyle = "#0c1524";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Draw primary image centered
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        // Draw CAD Metadata box onto download to show origin accuracy!
        ctx.fillStyle = "rgba(12, 18, 30, 0.9)";
        ctx.strokeStyle = "#ef4444";
        ctx.lineWidth = 4;
        ctx.fillRect(50, 50, 600, 240);
        ctx.strokeRect(50, 50, 600, 240);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 26px 'Space Grotesk', sans-serif";
        ctx.fillText("CADX INSPECTION COORDINATES LOCK", 80, 100);

        ctx.fillStyle = "#ef4444";
        ctx.font = "bold 22px 'JetBrains Mono', monospace";
        ctx.fillText("LOCKED ORIGIN: " + state.lockedOriginX + " , " + state.lockedOriginY, 80, 160);

        ctx.fillStyle = "#94a3b8";
        ctx.font = "20px 'Inter', sans-serif";
        ctx.fillText("IMAGE: " + state.currentImageName, 80, 210);
        ctx.fillText("EXPORTED AT: " + new Date().toLocaleString(), 80, 243);

        // Convert and trigger actual image click downloader
        const link = document.createElement('a');
        link.download = `cadx-inspected-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        triggerToast("CadX Snapshot downloaded to desktop catalog!");
      };

      img.onerror = function() {
        // Fallback simple link click
        const link = document.createElement('a');
        link.href = elements.image.src;
        link.target = "_blank";
        link.download = "cadx-drawing.jpg";
        link.click();
        triggerToast("Direct image viewport downloaded successfully!");
      }
    }

    // Handles loading presets
    function loadPreset(key) {
      const preset = PRESETS[key];
      if (!preset) return;

      unlockMagnifier();

      // Toggle button states
      document.querySelectorAll('[id^="preset-btn-"]').forEach(btn => {
        btn.classList.remove('border-red-500', 'bg-slate-900', 'active-preset');
      });
      document.getElementById(`preset-btn-${key}`).classList.add('border-red-500', 'bg-slate-900', 'active-preset');

      elements.image.style.opacity = '0';
      setTimeout(() => {
        elements.image.src = preset.url;
        state.currentImageName = preset.name;
        // Update labels
        document.querySelector('.scale-90').innerText = preset.calibration;
        document.querySelector('.scale-90').insertAdjacentHTML('afterbegin', '<span class="w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse mr-1 inline-block"></span>');
        document.querySelector('span[class*="M12"]').innerText = preset.meta;
        elements.image.style.opacity = '1';
        triggerToast(`LOADED: ${preset.name}`);
      }, 150);
    }

    // Intercepts local physical files dropped or selected via browse dialog!
    function handleFileSelect(event) {
      const files = event.target.files;
      if (files.length === 0) return;

      const file = files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
        unlockMagnifier();

        // Clear preset selector borders
        document.querySelectorAll('[id^="preset-btn-"]').forEach(btn => {
          btn.classList.remove('border-red-500', 'bg-slate-900', 'active-preset');
        });

        // Update stage draw src
        elements.image.src = e.target.result;
        state.currentImageName = file.name;

        // Reset footers to indicate user uploads specs
        document.querySelector('.scale-90').innerText = "Calibration: Custom Uploaded Spec";
        document.querySelector('span[class*="M12"]').innerText = `File: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;

        triggerToast(`FILE READ OK: ${file.name.toUpperCase()}`);
      };

      reader.readAsDataURL(file);
    }

    // Quick Toast feedback manager
    let toastTimeout;
    function triggerToast(message) {
      elements.toast.innerText = message;
      elements.toast.className = "fixed bottom-6 left-1/2 -translate-x-1/2 bg-red-600 border border-red-500 p-3 px-5 text-xs text-white uppercase tracking-wider font-mono-cad font-bold z-50 select-none transition-all duration-350 opacity-100 transform translate-y-0 rounded shadow-2xl scale-100";
      
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        elements.toast.className = "fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 border border-slate-700 p-3 px-5 text-xs text-white uppercase tracking-wider font-mono-cad font-bold z-50 select-none transition-all duration-300 opacity-0 pointer-events-none transform translate-y-2 rounded shadow-2xl scale-95";
      }, 3000);
    }
  </script>
</body>
</html>
